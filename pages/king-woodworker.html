<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Woodworker - Ariel Rodriguez Mendez</title>
    <link rel="stylesheet" href="../src/css/main.css">
        <link rel="apple-touch-icon" sizes="180x180" href="../images/icons/Ariel_Apple_Touch_Icon_180x180.png?v=20260718b">

<body data-category="brand">

            <a href="javascript:history.back()"><span class="nowrap">Back</span></a>
        </div>

    <main> 
        <section class="project-grid">
            <figure class="feature-item wide">
                <object
                    data="../images/portfolio/brand/king-woodworker/logo-animated.svg"
                    type="image/svg+xml"
                    aria-label="King Woodworker Animated Logo">
                    <img src="../images/portfolio/brand/king-woodworker/logo-animated.svg" alt="King Woodworker Animated Logo">

            </figure>
            <div class="feature-text">
                <h1 aria-describedby="king-woodworker-summary">King Woodworker</h1>

                <img src="../images/portfolio/brand/king-woodworker/logo-align.svg" alt="King Woodworker Static Logo">

                <img src="../images/portfolio/brand/king-woodworker/social-profile-picture.svg" alt="King Woodworker Static Logo">

            <figure class="feature-item">
                <img src="../images/portfolio/brand/king-woodworker/hard-hat.webp" alt="King Woodworker hard hat branding">
            </figure>            
            <figure class="feature-item ">
                <img src="../images/portfolio/brand/king-woodworker/business-card.svg" alt="King Woodworker business card design">
            </figure>

                <img src="../images/portfolio/brand/king-woodworker/letter.svg" alt="King Woodworker brand letter design">
            </figure> -->
